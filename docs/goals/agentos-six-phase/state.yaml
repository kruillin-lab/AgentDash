        - "Use executable plus argv command descriptors; validate captured native IDs."
        - "Record starting/running/exited/killed/failed/orphaned, exitCode, and exitReason."
        - "Prevent duplicate or ambiguous latest-mode resumes."
        - "Treat pre-restart live records as orphaned, never attachable."
      missing_verification:
